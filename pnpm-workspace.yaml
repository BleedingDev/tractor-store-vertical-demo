packages:
  - apps/*
  - verticals/*
  - packages/*

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@bleedingdev/modern-js-*'
blockExoticSubdeps: true
engineStrict: true
pmOnFail: error
verifyDepsBeforeRun: error
strictDepBuilds: true

peerDependencyRules:
  allowedVersions:
    react: '>=19.0.0'
    typescript: '>=6.0.0'

overrides:
  '@tanstack/react-router': 1.170.8
  node-fetch: '^3.3.2'

allowBuilds:
  '@swc/core': true
  core-js: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - '@swc/core'
  - core-js
  - esbuild
  - lefthook
  - msgpackr-extract
  - sharp
  - workerd
