packages:
  - apps/*
  - verticals/*
  - packages/*
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 1440
trustPolicyExclude:
  - '@effect/opentelemetry@4.0.0-rc.112'
  - effect@4.0.0-rc.112
blockExoticSubdeps: true
engineStrict: true
pmOnFail: error
verifyDepsBeforeRun: error
strictDepBuilds: true
peerDependencyRules:
  allowedVersions:
    react: '>=19.0.0'
    '@effect/vitest>effect': 4.0.0-rc.112
overrides:
  '@tanstack/react-router': 1.170.33
  '@tanstack/router-core': 1.171.28
  '@effect/opentelemetry': 4.0.0-rc.112
  '@effect/vitest': 4.0.0-rc.112
  effect: 4.0.0-rc.112
  node-fetch: ^3.3.2
  '@tanstack/history': 1.162.2
  msgpackr: 2.1.0
  zod: 4.5.4
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  workerd: true
